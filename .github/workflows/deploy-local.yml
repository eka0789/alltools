name: Deploy Local (Windows)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      force_install:
        description: "Force npm ci even if package-lock.json is unchanged"
        required: false
        type: boolean
        default: false
      skip_pull:
        description: "Skip git pull and only rebuild/restart"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-local-aktifkoding
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Windows local server
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.event == 'push'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy & restart local Next.js server
        shell: cmd
        env:
          LOCAL_DEPLOY_DIR: ${{ vars.LOCAL_DEPLOY_DIR }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
          APP_PORT: ${{ vars.APP_PORT }}
          NODE_DIR: ${{ vars.NODE_DIR }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          FORCE_INSTALL: ${{ inputs.force_install || 'false' }}
          SKIP_PULL: ${{ inputs.skip_pull || 'false' }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\deploy-windows.ps1 -FromEnv
