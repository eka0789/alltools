name: Deploy Production (LocalDeploy)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-local-aktifkoding
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via LocalDeploy API
    runs-on: [self-hosted, windows]
    timeout-minutes: 50
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.event == 'push'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: scripts

      - name: Trigger LocalDeploy build & health-checked rollout
        shell: powershell
        env:
          LOCALDEPLOY_API_URL: ${{ vars.LOCALDEPLOY_API_URL }}
          LOCALDEPLOY_APP_ID: ${{ vars.LOCALDEPLOY_APP_ID }}
          LOCALDEPLOY_TOKEN: ${{ secrets.LOCALDEPLOY_TOKEN }}
        run: ./scripts/deploy-localdeploy.ps1
